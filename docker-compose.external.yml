# Variante "mariadb/minio déjà existants sur le serveur" — voir la page
# Déploiement (documentation/guide-demarrage/deploiement) pour le détail.
# Ne définit ni `mysql` ni `minio` : rejoint le réseau Docker externe où
# vivent déjà ces conteneurs (`mariadb-network`, à adapter si le vôtre
# porte un autre nom) plutôt que d'en relancer une paire dédiée.
#
# `backend/.env` doit pointer DB_HOST/MINIO_ENDPOINT vers les noms de
# conteneur réels de ce mariadb/minio existants, pas `mysql`/`minio`.
#
# C'est cette version qu'utilise .github/workflows/deploy.yml (le
# déploiement continu part du principe que le mariadb/minio cible
# existe déjà) : `docker compose -f docker-compose.external.yml pull
# && docker compose -f docker-compose.external.yml up -d`. Pour un
# serveur vierge sans mariadb/minio, voir docker-compose.yml (usage
# manuel, non branché sur ce workflow).
#
# Images pré-construites par .github/workflows/ci.yml (job
# build-and-push-images, poussé sur GHCR à chaque push sur main) —
# pas de `build:` ici, le serveur ne rebuild jamais depuis les
# sources. Nom d'image en minuscules : GHCR l'exige, alors que
# github.repository (FireDroX/nestwiki) ne l'est pas.
services:
  backend:
    image: ghcr.io/firedrox/nestwiki-backend:latest
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    networks:
      - mariadb-network

  frontend:
    image: ghcr.io/firedrox/nestwiki-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mariadb-network

networks:
  mariadb-network:
    external: true
