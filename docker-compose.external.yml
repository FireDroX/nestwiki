# Variante "mariadb/minio déjà existants sur le serveur" — voir la page
# Déploiement (documentation/guide-demarrage/deploiement) pour le détail.
# Ne définit ni `mysql` ni `minio` : rejoint les réseaux Docker externes
# où vivent déjà ces conteneurs plutôt que d'en relancer une paire dédiée.
#
# Réseaux, nommés dans le .env racine (lu par docker compose) :
# - `default` (créé par compose) : frontend + backend, porte les ports
#   publiés. Le frontend ne voit ni la base ni le stockage.
# - DATABASE_NETWORK : réseau où le backend joint la base.
# - STORAGE_NETWORK : réseau où le backend joint le stockage objet.
# Les deux valent `mariadb-network` par défaut (base et stockage sur un
# même réseau partagé). Pour isoler, créer des réseaux --internal dédiés
# partagés uniquement avec la base / le stockage, ex. :
#   docker network create --internal db-nestwiki
#   docker network connect db-nestwiki mariadb
#
# Ports publiés sur BIND_ADDRESS (127.0.0.1 par défaut) : seul un reverse
# proxy ou un tunnel tournant sur l'hôte les atteint. 0.0.0.0 pour les
# exposer sur toutes les interfaces.
#
# `backend/.env` doit pointer DB_HOST/MINIO_ENDPOINT vers les noms de
# conteneur réels de ce mariadb/minio existants, pas `mysql`/`minio`.
#
# C'est cette version qu'utilise .github/workflows/deploy.yml (le
# déploiement continu part du principe que le mariadb/minio cible
# existe déjà) : `docker compose -f docker-compose.external.yml pull
# && docker compose -f docker-compose.external.yml up -d`. Pour un
# serveur vierge sans mariadb/minio, voir docker-compose.yml (usage
# manuel, non branché sur ce workflow).
#
# Images pré-construites par .github/workflows/ci.yml (job `image`,
# poussé sur GHCR à chaque push sur main), au tag NESTWIKI_TAG (`latest`
# par défaut ; deploy.yml y met la version du commit déployé) —
# pas de `build:` ici, le serveur ne rebuild jamais depuis les
# sources. Nom d'image en minuscules : GHCR l'exige, alors que
# github.repository (FireDroX/nestwiki) ne l'est pas.
services:
  backend:
    image: ghcr.io/firedrox/nestwiki-backend:${NESTWIKI_TAG:-latest}
    restart: unless-stopped
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    env_file:
      - backend/.env
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks:
      - default
      - database
      - storage

  frontend:
    image: ghcr.io/firedrox/nestwiki-frontend:${NESTWIKI_TAG:-latest}
    restart: unless-stopped
    environment:
      CSP_FRAME_ANCESTORS: ${CSP_FRAME_ANCESTORS:-'self'}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8080:80"
    depends_on:
      - backend
    networks:
      - default

networks:
  database:
    external: true
    name: ${DATABASE_NETWORK:-mariadb-network}
  storage:
    external: true
    name: ${STORAGE_NETWORK:-mariadb-network}
