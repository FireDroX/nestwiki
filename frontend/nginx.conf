map $http_user_agent $is_link_preview_bot {
  default 0;
  ~*(Discordbot|Twitterbot|Slackbot|facebookexternalhit|LinkedInBot|WhatsApp|TelegramBot|Mastodon|redditbot|Embedly|SkypeUriPreview) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # RFC 8414/9728 require these at the domain root, outside any reverse
  # proxy's /api prefix rule — forwarded here to the backend container
  # (same docker network) instead of falling into the SPA catch-all below.
  location = /.well-known/oauth-protected-resource {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Link preview bots (Discord, Slack, X...) don't run JavaScript, so the
  # SPA's index.html would give every page the same default card. They get
  # the per-page meta HTML rendered by the backend instead, through an
  # internal rewrite: the URL they see stays /pages/<path>. `return` is one
  # of the few directives that are safe inside `if` in a location.
  location /pages/ {
    error_page 418 = @link_preview_bot;
    if ($is_link_preview_bot) {
      return 418;
    }
    try_files $uri $uri/ /index.html;
  }

  location @link_preview_bot {
    rewrite ^/pages/(.*)$ /api/meta/pages/$1 break;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Vary User-Agent always;
  }

  location / {
    add_header Vary User-Agent always;
    try_files $uri $uri/ /index.html;
  }
}
