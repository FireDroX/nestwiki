map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $http_user_agent $is_link_preview_bot {
  default 0;
  ~*(Discordbot|Twitterbot|Slackbot|facebookexternalhit|LinkedInBot|WhatsApp|TelegramBot|Mastodon|redditbot|Embedly|SkypeUriPreview) 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # RFC 8414/9728 require these at the domain root, outside any reverse
  # proxy's /api prefix rule — forwarded here to the backend container
  # (same docker network) instead of falling into the SPA catch-all below.
  location = /.well-known/oauth-protected-resource {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /pages/ {
    error_page 418 = @link_preview_bot;
    if ($is_link_preview_bot) {
      return 418;
    }
    try_files $uri @spa_page;
  }

  location @spa_page {
    add_header Vary User-Agent always;
    rewrite ^ /index.html break;
  }

  location @link_preview_bot {
    rewrite ^/pages/(.*)$ /api/meta/pages/$1 break;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    add_header Vary User-Agent always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
