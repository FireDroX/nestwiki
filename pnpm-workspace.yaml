packages:
  - backend
  - frontend
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  # Pulled in transitively as an optional peer of @vitest/mocker, not a
  # direct dependency — its build script only matters for setupWorker()
  # (browser Service Worker registration), unused by our Node-side
  # vitest tests, so it stays disallowed.
  msw: false
overrides:
  undici: 6.28.1
  tmp: 0.2.7
  decode-uri-component: 0.5.0
  qs: 6.16.0
  stream-json: 3.6.0
  multer: 2.4.0
  fast-uri: 3.1.8
  hono: 4.13.7
  ip-address: 10.7.1
  brace-expansion: 5.0.12
  katex: 0.18.11
  source-map-js: 1.2.2
  proxy-addr: 2.0.8
  postcss-selector-parser: 7.1.6
  '@modelcontextprotocol/sdk': 1.32.1
