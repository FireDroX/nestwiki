packages:
  - backend
  - frontend
allowBuilds:
  '@scarf/scarf': false
  esbuild: true
  # Pulled in transitively as an optional peer of @vitest/mocker, not a
  # direct dependency — its build script only matters for setupWorker()
  # (browser Service Worker registration), unused by our Node-side
  # vitest tests, so it stays disallowed.
  msw: false
overrides:
  tmp: 0.2.7
  decode-uri-component: 0.5.1
  stream-json: 3.7.0
  katex: 0.19.1
  '@nestjs/mau>undici': 6.29.1
  'readdir-glob>minimatch': 11.0.9
  '@ts-morph/common>minimatch': 11.0.9
