# Version complète (mysql + minio + backend + frontend) — pour un
# serveur vierge. Si mariadb/minio existent déjà sur le serveur, voir
# docker-compose.external.yml à la place.
services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - mariadb-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Service/volume kept named "minio" even though the image is RustFS —
  # Minio's Community Edition (server) was archived in 2026 and is no
  # longer distributed anywhere (Docker Hub, dl.min.io binaries, all of
  # it). RustFS is a drop-in, actively maintained, Apache-2.0
  # S3-compatible replacement: same ports, and backend/.env's MINIO_*
  # variables (MINIO_ENDPOINT=minio, etc.) keep working unchanged since
  # they name this application's own storage config, not the container
  # software. Renaming either would orphan the `minio-data` volume on
  # servers already running the old image.
  #
  # UPGRADING AN EXISTING SERVER: RustFS runs as uid 10001, not root like
  # Minio did — `minio-data` already has files owned by root from the old
  # image, and RustFS's entrypoint doesn't chown existing directories.
  # One-time fix before `docker compose up -d` picks up the new image:
  #   docker compose stop minio
  #   docker run --rm -v <project-dir-name>_minio-data:/data alpine chown -R 10001:10001 /data
  # (volume name printed by `docker volume ls`; a brand-new deployment's
  # empty volume doesn't need this — Docker seeds it from the image's own
  # ownership on first use.)
  minio:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - mariadb-network

  # Application containers (production deploy — see README.md). Not
  # needed for local dev, where the backend/frontend run via `pnpm run
  # start:dev` / `pnpm run dev` against these same mysql/minio services.
  #
  # backend/.env on the server must point DB_HOST/MINIO_ENDPOINT at the
  # `mysql`/`minio` service names below (not `localhost`, unlike the
  # local-dev default in backend/.env.example) — see README.md.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - mariadb-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - mariadb-network

networks:
  mariadb-network:
    driver: bridge

volumes:
  mysql-data:
  minio-data:
