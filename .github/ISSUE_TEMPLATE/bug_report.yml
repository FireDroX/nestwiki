name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For a security problem, do **not** open an issue: follow [SECURITY.md](https://github.com/FireDroX/nestwiki/blob/main/SECURITY.md) instead.
  - type: input
    id: version
    attributes:
      label: NestWiki version
      description: Shown in the release notes page, or the tag of the Docker image you run.
      placeholder: 1.0.4
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - docker-compose.yml (all-in-one)
        - Pre-built images from GHCR
        - From source (pnpm)
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages, backend logs or browser console output when relevant. Remove any secret first.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 131 on Ubuntu 24.04
