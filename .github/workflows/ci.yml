name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  DB_HOST: localhost
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: ci-mysql-root-password
  DB_DATABASE: nestwiki
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: ci-storage-secret-key
  MINIO_BUCKET: nestwiki
  MINIO_USE_SSL: 'false'
  JWT_ACCESS_SECRET: ci-jwt-access-secret-not-for-production
  JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-for-production
  FRONTEND_URL: http://localhost:5173
  PORT: '3000'

jobs:
  backend:
    name: backend (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run lint
      - run: pnpm --filter backend run test

  backend-e2e:
    name: backend (e2e tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL and object storage
        run: .github/scripts/test-services.sh start
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MySQL and object storage
        run: .github/scripts/test-services.sh wait
      - run: pnpm --filter backend run test:e2e

  frontend:
    name: frontend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run lint
      - run: pnpm --filter frontend run test

  # Runs alongside the tests instead of after them: images are built on
  # every PR (never pushed) so a broken Dockerfile shows up before the
  # merge, and on main only the immutable `sha-<commit>` tag is pushed
  # here. `latest`/`X.Y.Z`/`X.Y` are added by `release`, once every
  # test job has passed.
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start MySQL and object storage
        if: matrix.image == 'backend'
        run: .github/scripts/test-services.sh start

      - uses: docker/setup-buildx-action@v4

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # docker/metadata-action lowercases the image ref for us — GHCR
      # rejects uppercase, and github.repository_owner carries this
      # repo's actual (mixed-case) owner.
      - name: Extract metadata (tag, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nestwiki-${{ matrix.image }}
          tags: type=sha,format=long
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Smoke test the backend image (migrations, seeds, /api/health)
        if: matrix.image == 'backend'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          ADMIN_EMAIL: admin@ci.local
          ADMIN_PASSWORD: Ci-Admin-Password-1!
          ADMIN_DISPLAY_NAME: CI Admin
        run: |
          .github/scripts/test-services.sh wait
          docker run -d --name backend --network host \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE \
            -e MINIO_ENDPOINT -e MINIO_PORT -e MINIO_ACCESS_KEY -e MINIO_SECRET_KEY -e MINIO_BUCKET -e MINIO_USE_SSL \
            -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e FRONTEND_URL -e PORT \
            -e ADMIN_EMAIL -e ADMIN_PASSWORD -e ADMIN_DISPLAY_NAME \
            "$IMAGE"
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health; then
              echo
              docker logs backend
              time docker stop backend
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' backend)" != true ]; then
              break
            fi
            sleep 1
          done
          docker logs backend
          echo "The backend image did not answer /api/health" >&2
          exit 1

      - name: Log in to the Container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the sha-<commit> tag
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}

  release:
    name: release
    needs: [backend, backend-e2e, frontend, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested images as latest, X.Y.Z and X.Y
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in backend frontend; do
            repository="${REGISTRY}/${owner}/nestwiki-${image}"
            docker buildx imagetools create \
              -t "${repository}:latest" \
              -t "${repository}:${VERSION}" \
              -t "${repository}:${VERSION%.*}" \
              "${repository}:sha-${GITHUB_SHA}"
          done

      - name: Tag the version and publish its GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already released, nothing to do."
            exit 0
          fi
          awk -v heading="## ${VERSION} " 'index($0, heading) == 1 { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## ${VERSION} — <date>' section." >&2
            exit 1
          fi
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file release-notes.md
