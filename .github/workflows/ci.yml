name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# DB_PASSWORD, MINIO_SECRET_KEY and the JWT secrets are generated at the
# start of each job that needs them (.github/scripts/ci-secrets.sh):
# a value written here would be public, and the backend refuses to start
# with a known one.
env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  DB_HOST: localhost
  DB_PORT: 3306
  DB_USERNAME: root
  DB_DATABASE: nestwiki
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: nestwiki
  MINIO_BUCKET: nestwiki
  MINIO_USE_SSL: 'false'
  FRONTEND_URL: http://localhost:5173
  PORT: '3000'

jobs:
  backend:
    name: backend (lint + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: .github/scripts/ci-secrets.sh
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend run lint
      - run: pnpm --filter backend run test

  backend-e2e:
    name: backend (e2e tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate throwaway secrets
        run: .github/scripts/ci-secrets.sh
      - name: Start MySQL and object storage
        run: .github/scripts/test-services.sh start
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for MySQL and object storage
        run: .github/scripts/test-services.sh wait
      - run: pnpm --filter backend run test:e2e

  frontend:
    name: frontend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run lint
      - run: pnpm --filter frontend run test

  # Runs alongside the tests instead of after them: images are built on
  # every PR (never pushed) so a broken Dockerfile shows up before the
  # merge, and on main and dev only the immutable `sha-<commit>` tag is
  # pushed here. `latest`/`X.Y.Z`/`X.Y` (main) and `dev`/`X.Y.Z-dev`
  # (dev) are added by `release`/`prerelease`, once every test job (and
  # the backend smoke test) has passed.
  #
  # Only main writes the layer cache: a PR's cache scope can't be read
  # by other PRs, while every PR can read main's.
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    env:
      PUSH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') }}
      WRITE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate throwaway secrets
        if: matrix.image == 'backend'
        run: .github/scripts/ci-secrets.sh

      - name: Start MySQL and object storage
        if: matrix.image == 'backend'
        run: .github/scripts/test-services.sh start

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # docker/metadata-action lowercases the image ref for us — GHCR
      # rejects uppercase, and github.repository_owner carries this
      # repo's actual (mixed-case) owner.
      - name: Extract metadata (tag, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/nestwiki-${{ matrix.image }}
          tags: type=sha,format=long
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Log in to the Container registry
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image (and push its sha-<commit> tag on main and dev)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          load: ${{ matrix.image == 'backend' }}
          push: ${{ env.PUSH == 'true' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: ${{ env.WRITE_CACHE == 'true' && format('type=gha,mode=max,scope={0}', matrix.image) || '' }}

      - name: Smoke test the backend image (migrations, seeds, /api/health)
        if: matrix.image == 'backend'
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
          ADMIN_EMAIL: admin@ci.local
          ADMIN_DISPLAY_NAME: CI Admin
        run: |
          .github/scripts/test-services.sh wait
          docker run -d --name backend --network host \
            -e DB_HOST -e DB_PORT -e DB_USERNAME -e DB_PASSWORD -e DB_DATABASE \
            -e MINIO_ENDPOINT -e MINIO_PORT -e MINIO_ACCESS_KEY -e MINIO_SECRET_KEY -e MINIO_BUCKET -e MINIO_USE_SSL \
            -e JWT_ACCESS_SECRET -e JWT_REFRESH_SECRET -e FRONTEND_URL -e PORT \
            -e ADMIN_EMAIL -e ADMIN_PASSWORD -e ADMIN_DISPLAY_NAME \
            "$IMAGE"
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:3000/api/health; then
              echo
              docker logs backend
              time docker stop backend
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' backend)" != true ]; then
              break
            fi
            sleep 1
          done
          docker logs backend
          echo "The backend image did not answer /api/health" >&2
          exit 1

  release:
    name: release
    needs: [backend, backend-e2e, frontend, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested images as latest, X.Y.Z and X.Y
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in backend frontend; do
            repository="${REGISTRY}/${owner}/nestwiki-${image}"
            docker buildx imagetools create \
              -t "${repository}:latest" \
              -t "${repository}:${VERSION}" \
              -t "${repository}:${VERSION%.*}" \
              "${repository}:sha-${GITHUB_SHA}"
          done

      # Every version merged from dev was published as a pre-release:
      # those up to this one become releases, and this version's
      # pre-release is replaced by a release tagged on this main commit.
      - name: Promote the merged pre-releases and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          state="$(gh release view "v${VERSION}" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo missing)"
          if [ "$state" = false ]; then
            echo "v${VERSION} is already released, nothing to do."
            exit 0
          fi
          sh .github/scripts/changelog-section.sh "$VERSION"
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' |
            while read -r tag; do
              older="$(printf '%s\n%s\n' "${tag#v}" "$VERSION" | sort -V | head -n 1)"
              if [ "$tag" != "v${VERSION}" ] && [ "$older" = "${tag#v}" ]; then
                gh release edit "$tag" --prerelease=false --latest=false
              fi
            done
          if [ "$state" = true ]; then
            gh release delete "v${VERSION}" --cleanup-tag --yes
          fi
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file release-notes.md --latest

  # dev is the integration branch: every push publishes the tested
  # images as `dev`/`X.Y.Z-dev` and the version as a GitHub pre-release,
  # without deploying anything (deploy.yml only follows main).
  prerelease:
    name: pre-release
    needs: [backend, backend-e2e, frontend, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested images as dev and X.Y.Z-dev
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in backend frontend; do
            repository="${REGISTRY}/${owner}/nestwiki-${image}"
            docker buildx imagetools create \
              -t "${repository}:dev" \
              -t "${repository}:${VERSION}-dev" \
              "${repository}:sha-${GITHUB_SHA}"
          done

      # A new push of the same version (review fixes) moves its
      # pre-release to this commit; a version already released on main
      # is never touched.
      - name: Publish the version as a GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          state="$(gh release view "v${VERSION}" --json isPrerelease --jq '.isPrerelease' 2>/dev/null || echo missing)"
          if [ "$state" = false ]; then
            echo "v${VERSION} is already released: bump the version to publish a pre-release."
            exit 0
          fi
          sh .github/scripts/changelog-section.sh "$VERSION"
          if [ "$state" = true ]; then
            gh release delete "v${VERSION}" --cleanup-tag --yes
          fi
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file release-notes.md --prerelease
