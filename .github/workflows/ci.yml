name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository_owner }}/nestwiki-backend
  FRONTEND_IMAGE: ${{ github.repository_owner }}/nestwiki-frontend

jobs:
  lint:
    name: lint (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.workspace }} run lint

  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-root-password
          MYSQL_DATABASE: nestwiki
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ci-mysql-root-password
      DB_DATABASE: nestwiki
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: ci-storage-secret-key
      MINIO_BUCKET: nestwiki
      MINIO_USE_SSL: 'false'
      JWT_ACCESS_SECRET: ci-jwt-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret-not-for-production
      FRONTEND_URL: http://localhost:5173
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Not a `services:` container: GitHub Actions services can't override
      # CMD, and this image needs env vars set before its entrypoint runs.
      # Uses RustFS, not Minio — Minio's Community Edition (server, both
      # `minio/minio` and `bitnami/minio` on Docker Hub, and the binaries
      # on dl.min.io) was archived in 2026 and is no longer distributed
      # anywhere. RustFS is a drop-in, actively maintained, Apache-2.0
      # S3-compatible replacement — same docker-compose.yml switch, see
      # that file's `minio` service for the matching prod/dev setup.
      - name: Start Minio
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e RUSTFS_ACCESS_KEY=minioadmin -e RUSTFS_SECRET_KEY=ci-storage-secret-key \
            -e RUSTFS_ADDRESS=":9000" -e RUSTFS_CONSOLE_ADDRESS=":9001" \
            rustfs/rustfs:latest /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/health && exit 0
            sleep 1
          done
          echo "Minio did not become healthy in time" >&2
          exit 1
      - run: pnpm --filter backend run test
      - run: pnpm --filter backend run test:e2e

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend run test

  build-and-push-images:
    name: build-and-push-images
    needs: [lint, test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read the project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # docker/metadata-action lowercases the image ref for us — GHCR
      # rejects uppercase, and github.repository_owner carries this
      # repo's actual (mixed-case) owner.
      - name: Extract metadata (tags, labels) for backend
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata (tags, labels) for frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=sha,format=long

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_TURNSTILE_SITE_KEY=${{ vars.VITE_TURNSTILE_SITE_KEY }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Tag the version and publish its GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null; then
            echo "v${VERSION} is already released, nothing to do."
            exit 0
          fi
          awk -v heading="## ${VERSION} " 'index($0, heading) == 1 { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## ${VERSION} — <date>' section." >&2
            exit 1
          fi
          gh release create "v${VERSION}" --target "${GITHUB_SHA}" --title "v${VERSION}" --notes-file release-notes.md
