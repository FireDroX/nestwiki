version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    target-branch: dev
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
